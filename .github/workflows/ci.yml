name: HonCut Pipeline CI

env:
  PYTHON_VERSION: '3.12.13'
  UV_VERSION: '0.11.26'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up bootstrap Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install locked uv version
      run: python -m pip install "uv==${UV_VERSION}"

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: uv sync --locked --managed-python

    - name: Verify project interpreter
      run: uv run --locked --managed-python python scripts/check_python_environment.py

    - name: Run tests
      run: |
        uv run --locked --managed-python python -m pytest \
          pipeline/tests/ pipeline/test_story_order_multimodal.py \
          -v --cov=pipeline/src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install locked uv version
      run: python -m pip install "uv==${UV_VERSION}"

    - name: Install dependencies
      run: uv sync --locked --managed-python

    - name: Run Ruff critical checks
      run: uv run --locked --managed-python python -m ruff check pipeline/src pipeline/tests --select E9,F63,F7,F82

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install locked uv version
      run: python -m pip install "uv==${UV_VERSION}"

    - name: Install dependencies
      run: uv sync --locked --managed-python

    - name: Build package
      run: uv run --locked --managed-python python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
