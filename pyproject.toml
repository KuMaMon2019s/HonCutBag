[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honcut-pipeline"
version = "0.1.0"
description = "HonCut AI Video Generation Pipeline"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
license = "MIT"
authors = [
    {name = "Doraemon", email = "soda804507080@gmail.com"}
]
dependencies = [
    "openai>=1.0.0",
    "httpx2>=2.12.0,<3",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "scenedetect>=0.6.4,<0.7",
    "opencv-python-headless>=4.10",
    "python-dotenv>=1.0.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain-core>=1.5.0",
    "websockets>=12.0",
    "arq>=0.28.0",
    "json-repair>=0.63.4",
    "open-clip-torch==3.3.0",
]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
]

[project.optional-dependencies]
sam3 = [
    "torch>=2.5",
    "torchvision>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    "timm>=1.0.17",
    "numpy>=1.26,<2",
    "tqdm",
    "ftfy==6.1.1",
    "regex",
    "iopath>=0.1.10",
    "typing_extensions",
    "huggingface_hub",
    "einops>=0.8",
    "pycocotools>=2.0.10",
    "socksio>=1.0",
]

[project.scripts]
honcut = "honcut.pipeline_runner:main"

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["pipeline/src"]

[tool.setuptools]
py-modules = ["pipeline_runner"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pipeline/src", "pipeline/tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "RUF001", # ambiguous unicode character in string (Chinese punctuation)
    "RUF002", # ambiguous unicode character in docstring (Chinese punctuation)
    "RUF003", # ambiguous unicode character in comment (Chinese punctuation)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"pipeline/tests/*" = ["E501", "B011"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
python_files = ["test_*.py"]
