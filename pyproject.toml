[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honcut-pipeline"
version = "0.1.0"
description = "HonCut AI Video Generation Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Doraemon", email = "soda804507080@gmail.com"}
]
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
]

[project.scripts]
honcut = "honcut.pipeline_runner:main"

[tool.setuptools.packages.find]
where = ["pipeline/src"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pipeline/src", "pipeline/tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "RUF001", # ambiguous unicode character in string (Chinese punctuation)
    "RUF002", # ambiguous unicode character in docstring (Chinese punctuation)
    "RUF003", # ambiguous unicode character in comment (Chinese punctuation)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"pipeline/tests/*" = ["E501", "B011"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
python_files = ["test_*.py"]
